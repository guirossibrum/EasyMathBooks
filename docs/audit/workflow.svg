xt x="81" y="640" class="detail">Only reachable through the gear</text><rect x="65" y="710" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="81" y="738" class="node">Browser report</text><text x="81" y="760" class="detail">Report file was overwritten on export</text><rect x="845" y="230" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="861" y="258" class="node">Worksheet</text><text x="861" y="280" class="detail">Create, record, or reprint</text><rect x="1225" y="230" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="1241" y="258" class="node">Progress</text><text x="1241" y="280" class="detail">Results and weekly reports</text><rect x="845" y="350" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="861" y="378" class="node">Reprint worksheet</text><text x="861" y="400" class="detail">Pending sheet or a sheet code</text><rect x="1225" y="350" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="1241" y="378" class="node">Weekly reports</text><text x="1241" y="400" class="detail">Choose a week; timing is optional</text><rect x="845" y="470" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="861" y="498" class="node">Practice</text><text x="861" y="520" class="detail">Generated sheet remains selected</text><rect x="1225" y="470" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="1241" y="498" class="node">Browser keepsake</text><text x="1241" y="520" class="detail">New report version; old one stays intact</text><rect x="845" y="630" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="861" y="658" class="node">Settings hub</text><text x="861" y="680" class="detail">Configuration, with a real return path</text><rect x="845" y="750" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="861" y="778" class="node">Print options</text><text x="861" y="800" class="detail">Paper, examples, answers, motif</text><rect x="1225" y="750" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="1241" y="778" class="node">Reminder preferences</text><text x="1241" y="800" class="detail">Consent, toggles, days, time</text><rect x="845" y="870" width="280" height="68" rx="12" fill="#fff" stroke="#a6b7b2"/><text x="861" y="898" class="node">Student profiles</text><text x="861" y="920" class="detail">Name, gender, report motif</text><text x="65" y="855" class="node" fill="#b45353">The confusing jumps</text><text x="65" y="884" class="sub">• Reprinting looked like a settings task.</text><text x="65" y="912" class="sub">• Saving a motif changed the section unexpectedly.</text><text x="65" y="940" class="sub">• Back meant different things on different pages.</text><text x="65" y="968" class="sub">• Plugin reloads discarded the current screen and drafts.</text><text x="845" y="980" class="sub">Back returns to the actual caller, including direct edits from Progress.</text></svg>